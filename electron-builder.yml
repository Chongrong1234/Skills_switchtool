# electron-builder 配置:Linux AppImage;Windows NSIS 安装包;macOS dmg/zip(由 CI 构建)
appId: com.skillsswitchtool.app
productName: Skills SwitchTool
directories:
  output: release
files:
  # 只打包编译产物 + 主进程 + 静态前端;devDeps(tsx/vitest 等)不进入产物
  - dist/**
  - electron/**
  - public/**
  - package.json
linux:
  target: AppImage
  category: Utility
  icon: build/icon.png
win:
  target: nsis
  icon: build/icon.ico
nsis:
  # 中文安装界面;允许用户选择安装目录
  language: "2052"
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: build/icon.png
